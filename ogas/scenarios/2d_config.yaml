    domain_extent: 2.5
    resolution: 2048
    ts: 30
    ts_val: 50
    ts_test: 100
    warmup_steps: 75
    dt: 30.0
    substeps: 30
    boundary_conditions_order: ["x negative", "x positive", "y negative", "y positive"]
    boundary_conditions: ["periodic", "periodic", "periodic", "periodic"]

    physical_constant:
      diffusivity_1:
        dim: 1
        value: 0.00002
      diffusivity_2:
        dim: 1
        value: 0.00001
      feed_rate:
        dim: 1
        value: 0.008
      kill_rate:
        dim: 1
        value: 0.046

    feed_kill_pairs:
      - feed: 0.008
        kill: 0.046

    initial_conditions:
      gaussian_blobs:
        num_blobs: 4
        position_range: [0.2, 0.8]
        complement_pair: true

