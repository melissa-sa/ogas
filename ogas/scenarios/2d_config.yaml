pde_list:
  advection:
    dim: 2
    fields_scheme: "d"
    fields: ["Density"]
    domain_extent: 1.0
    resolution: 2048
    ts: 30
    ts_val: 50
    dt: 0.01
    substeps: 1
    boundary_conditions_order: ["x negative", "x positive", "y negative", "y positive"]
    boundary_conditions: ["periodic", "periodic", "periodic", "periodic"]

    physical_constant:
      velocity: # the name has to be the arg name from the steper as it will be used like that
        dim: 2
        min: [-5.0, -5.0]
        max: [5.0, 5.0]

    initial_conditions:
      truncated_fourier:
        cutoff: [2,11]
      gaussian_field:
        pl_exponent: [2.3,3.6]
      diffused_noise:
        init_intensity: [0.00005,0.01]

  diffusion:
    dim: 2
    fields_scheme: "d"
