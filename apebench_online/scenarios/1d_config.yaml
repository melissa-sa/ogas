pde_list:
  advection:
    _base_pde_name: "advection"
    dim: 1
    fields_scheme: "d"
    fields: ["Density"]
    domain_extent: 1.0
    resolution: 2048
    ts: 75
    ts_val: 100
    dt: 0.01
    substeps: 1
    boundary_conditions_order: ["x negative", "x positive"]
    boundary_conditions: ["periodic", "periodic"]
    physical_constant:
      velocity:
        dim: 1
        min: [-5.0]
        max: [5.0]
    initial_conditions:
      sine_sup:
        num_waves: 2
        max_one: false

  burgers_1d:
    _base_pde_name: "burgers"
    dim: 1
    fields_scheme: "d"
