    dt: 0.01
    substeps: 1
    boundary_conditions_order: ["x negative", "x positive"]
    boundary_conditions: ["periodic", "periodic"]
    stepper_kwargs:
      diffusivity: 0.01
      convection_scale: 1.0
      single_channel: true
      conservative: false
    initial_conditions:
      sine_sup:
        num_waves: 2
        max_one: false

  diff_kdv__2w_x04_harder_max1_1d_x5:
