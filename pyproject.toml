[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apebench-online"
version = "0.1.0"
description = "OGAS: online generative active sampling for neural PDE surrogates (Melissa + APEBench)"
readme = "README.md"
authors = [{name = "DATAMOVE Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "melissa[torch]",
    "jax>=0.7.0",
    "apebench",
    "wandb",
    "scikit-learn",
    "scipy==1.17.1",
    "snakemake"
]

# JAX CUDA variant: CUDA 12 (group, installed by default) or CUDA 13 (extra); never both, since
# two JAX CUDA plugins would both register the "cuda" device.
[project.optional-dependencies]
cuda13 = ["jax[cuda13]>=0.7.0"]

# Melissa's CMake installs Conduit into the active venv, so it must not be built in uv's isolated
# (temporary) build environment; its build requirements come from the "build" group instead.
[dependency-groups]
build = [
  "scikit-build-core>=0.11",
  "pybind11>=3",
  "mpi4py>=3.1.6",
  "pip>=23",
  "setuptools>=68",
  "numpy>=1.21",
  "cmake==3.31.10",
]
cuda12 = ["jax[cuda12]>=0.7.0"]

[tool.uv]
default-groups = ["build", "cuda12"]
no-build-isolation-package = ["melissa"]
reinstall-package = ["melissa"]
no-binary-package = ["mpi4py"]
conflicts = [[{group = "cuda12"}, {extra = "cuda13"}]]

[tool.uv.sources]
melissa = { path = "melissa" }

[tool.uv.config-settings-package]
melissa = { "cmake.define.INSTALL_CONDUIT" = "ON", "cmake.define.INSTALL_ZMQ" = "ON" }

[tool.setuptools.packages.find]
include = ["apebench_online*", "scripts*", "tests*"]

[tool.black]
line-length = 100
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | melissa
  | snakemake_setup
)/
'''
include = '\.pyi?$'
